# 开发环境：H2 嵌入式数据库，启动即建表
spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:./data/excel-demo;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    com.demo.excel: DEBUG
